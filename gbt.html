<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor: Solucionador ABC & ABM | CEST Anil</title>
    <style>
        :root {
            --primary: #002060; --primary-dark: #001138; --secondary: #0080FF;
            --secondary-light: #E6F2FF; --background: #F4F7FA; --surface: #FFFFFF;
            --text-primary: #0F172A; --text-secondary: #475569; --border: #CBD5E1;
            --radius-md: 12px; --font-mono: 'Consolas', 'Courier New', monospace;
            --shadow-sm: 0 1px 3px rgba(0,32,96,0.06); --shadow-md: 0 6px 20px -2px rgba(0,32,96,0.1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--background); color: var(--text-primary); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #FFFFFF; padding: 2.25rem 2rem; border-radius: var(--radius-md); margin-bottom: 2rem;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }
        .header-brand h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.35rem; }
        .header-badge { background: rgba(255,255,255,0.12); padding: 0.75rem 1.25rem; border-radius: 6px; text-align: right; border: 1px solid rgba(255,255,255,0.2); }

        .nav-dock {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 1rem 1.5rem; margin-bottom: 2rem; position: sticky; top: 1rem; z-index: 100; box-shadow: var(--shadow-sm);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;
        }
        .nav-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .nav-btn {
            background: var(--background); border: 1px solid var(--border); color: var(--primary);
            font-weight: 700; font-size: 0.85rem; padding: 0.4rem 0.75rem; border-radius: 4px; text-decoration: none;
        }
        .nav-btn:hover { background: var(--secondary); color: #FFF; border-color: var(--secondary); }

        .btn-print {
            background: var(--primary); color: #FFF; font-weight: 700; font-size: 0.85rem;
            padding: 0.5rem 1.25rem; border-radius: 6px; border: none; cursor: pointer;
        }
        .btn-print:hover { background: var(--secondary); }

        .solver-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 2rem; margin-bottom: 2rem; border-top: 5px solid var(--secondary); box-shadow: var(--shadow-sm);
        }
        .solver-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.25rem; }
        .card-title { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
        .card-tag { background: var(--secondary-light); color: var(--primary); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; }

        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
        .form-label { font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase; }
        .form-control { padding: 0.65rem; font-size: 0.95rem; font-family: var(--font-mono); font-weight: 700; border: 1.5px solid var(--border); border-radius: 6px; }

        .solution-box { background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
        .formula-notepad {
            background: #FFFFFF; border: 1px solid var(--border); border-left: 4px solid var(--primary);
            padding: 0.75rem 1rem; border-radius: 4px; font-family: var(--font-mono); font-size: 0.88rem;
            white-space: pre-wrap; line-height: 1.5; color: #1E293B; margin-bottom: 1rem;
        }

        .step-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .step-item { font-family: var(--font-mono); font-size: 0.9rem; color: #1E293B; }

        .res-final {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #FFF; padding: 1.2rem 1.5rem; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
        }
        .res-val { font-size: 1.5rem; font-weight: 800; color: #A7F3D0; }
        .dica { margin-top: 1rem; font-size: 0.88rem; color: #334155; background: #EFF6FF; border-left: 3px solid var(--secondary); padding: 0.75rem 1rem; border-radius: 4px; }

        @media print {
            body { background: #FFF; color: #000; }
            header, .nav-dock, .btn-print { display: none !important; }
            .solver-card { break-inside: avoid; border: 1px solid #333 !important; box-shadow: none !important; margin-bottom: 1.5rem; }
            .res-final { background: #FFF !important; color: #000 !important; border: 2px solid #000; }
            .res-val { color: #000 !important; }
            .formula-notepad { border: 1px solid #333 !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-brand">
                <h1>Painel do Professor: Solucionador em Sala de Aula</h1>
                <p>Gabarito Técnico Detalhado • Gestão de Custos CEST Anil</p>
            </div>
            <div class="header-badge">
                <strong style="font-size:0.95rem; display:block;">Prof. Msc. Philipe Sampaio Lima</strong>
                <span>Custeio ABC & Gestão Baseada em Atividades</span>
            </div>
        </header>

        <div class="nav-dock">
            <div>
                <span style="font-size:0.8rem; font-weight:800; text-transform:uppercase; color:var(--primary); display:block; margin-bottom:4px;">Navegação Rápida</span>
                <div class="nav-buttons" id="navButtons"></div>
            </div>
            <button class="btn-print" onclick="window.print()">Imprimir Gabarito Completo / PDF</button>
        </div>

        <div id="solversContainer"></div>
    </div>

    <script>
        function formatMoeda(n) { return "R$ " + (isNaN(n) ? 0 : n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        function parseBR(v) { return parseFloat((v || '0').toString().replace(/\./g, '').replace(',', '.')) || 0; }

        const configs = [
            {
                id: 1, titulo: "Questão 1: Taxa da Atividade de Preparação de Máquinas", tag: "Cost Drivers",
                enunciado: "Calcular o custo unitário por preparação dividindo o custo acumulado pelo número de preparações realizadas.",
                formula: "Taxa da Atividade = Custo Total da Preparacao / Quantidade Total de Preparacoes",
                inputs: [
                    { id: "q1_c", label: "Custo da Atividade (R$)", def: "48.000,00" },
                    { id: "q1_q", label: "Total de Preparações", def: "120" }
                ],
                calc: () => {
                    const c = parseBR(document.getElementById('q1_c').value);
                    const q = parseBR(document.getElementById('q1_q').value) || 1;
                    const r = c / q;
                    return {
                        steps: [
                            `Passo 1: Identificar a relacao causal da atividade: Taxa = Custo da Atividade / Base do Direcionador`,
                            `Passo 2: Substituir os valores oficiais: ${formatMoeda(c)} / ${q} preparacoes`,
                            `Passo 3: Taxa unitaria apurada: ${formatMoeda(r)} por preparacao`
                        ],
                        res: `${formatMoeda(r)} / preparacao`,
                        dica: "Explique aos alunos que na transição para a escala 5x2 cada preparação precisa ser ágil, pois o tempo de máquina livre na semana produtiva é menor."
                    };
                }
            },
            {
                id: 2, titulo: "Questão 2: Apropriação de Custo Indireto ao Lote Customizado", tag: "Alocação aos Lotes",
                enunciado: "Multiplicar a taxa da atividade pela quantidade de preparações consumidas pelo lote.",
                formula: "CIF Absorvido pelo Lote = Taxa Unitaria da Preparacao * Preparacoes Consumidas",
                inputs: [
                    { id: "q2_t", label: "Taxa por Preparação (R$)", def: "400,00" },
                    { id: "q2_n", label: "Preparações do Lote", def: "8" }
                ],
                calc: () => {
                    const t = parseBR(document.getElementById('q2_t').value);
                    const n = parseBR(document.getElementById('q2_n').value);
                    const r = t * n;
                    return {
                        steps: [
                            `Passo 1: Multiplicar a taxa unitaria pelo consumo real: ${formatMoeda(t)} * ${n} preparacoes`,
                            `Passo 2: Total de CIF absorvido pelo lote = ${formatMoeda(r)}`
                        ],
                        res: formatMoeda(r),
                        dica: "Demonstre que o Custeio ABC atribui custos em função do esforço requerido, e não pela quantidade total de peças fabricadas."
                    };
                }
            },
            {
                id: 3, titulo: "Questão 3: Taxa Horária de Inspeção Laboratorial", tag: "Cost Drivers",
                enunciado: "Calcular o custo por hora técnica de inspeção e controle de qualidade.",
                formula: "Taxa de Inspecao = Custo do Laboratorio / Total de Horas Tecnicas de Inspecao",
                inputs: [
                    { id: "q3_c", label: "Custo do Setor (R$)", def: "36.000,00" },
                    { id: "q3_h", label: "Horas Técnicas", def: "600" }
                ],
                calc: () => {
                    const c = parseBR(document.getElementById('q3_c').value);
                    const h = parseBR(document.getElementById('q3_h').value) || 1;
                    const r = c / h;
                    return {
                        steps: [
                            `Passo 1: Taxa Horaria = ${formatMoeda(c)} / ${h} horas tecnicas`,
                            `Passo 2: Resultado = ${formatMoeda(r)} por hora tecnica de inspecao`
                        ],
                        res: `${formatMoeda(r)} / hora`,
                        dica: "A inspeção constitui um direcionador de duração, mais justo do que apenas contar o número de testes laboratoriais."
                    };
                }
            },
            {
                id: 4, titulo: "Questão 4: Rateio Tradicional por Volume Físico", tag: "Absorção Tradicional",
                enunciado: "Calcular a partilha tradicional dos custos indiretos com base no volume de unidades para contrastar com o ABC.",
                formula: "CIF Alocado = CIF Global * (Volume da Linha / Volume Total)",
                inputs: [
                    { id: "q4_cif", label: "CIF Global (R$)", def: "120.000,00" },
                    { id: "q4_va", label: "Volume Linha Padrão", def: "8.000" },
                    { id: "q4_vb", label: "Volume Linha Especial", def: "2.000" }
                ],
                calc: () => {
                    const cif = parseBR(document.getElementById('q4_cif').value);
                    const va = parseBR(document.getElementById('q4_va').value);
                    const vb = parseBR(document.getElementById('q4_vb').value);
                    const tot = va + vb || 1;
                    const r = cif * (va / tot);
                    return {
                        steps: [
                            `Passo 1: Volume Fabril Global = ${va} un + ${vb} un = ${tot} unidades`,
                            `Passo 2: Percentual da Linha Padrao = ${va} / ${tot} = ${((va/tot)*100).toFixed(2)}%`,
                            `Passo 3: CIF Alocado a Linha Padrao = ${formatMoeda(cif)} * ${((va/tot)*100).toFixed(2)}% = ${formatMoeda(r)}`
                        ],
                        res: formatMoeda(r),
                        dica: "Enfatize aos alunos que a Linha Padrão absorve 80% dos custos simplesmente porque produz mais itens, caracterizando subsídio cruzado."
                    };
                }
            },
            {
                id: 5, titulo: "Questão 5: Custo da Atividade de Suprimentos e Compras", tag: "Atividade de Apoio",
                enunciado: "Calcular o montante de custos do setor de suprimentos alocado a uma linha com base nas ordens de compra emitidas.",
                formula: "Custo Alocado = (Custo Total de Compras / Total de Ordens) * Ordens da Linha",
                inputs: [
                    { id: "q5_c", label: "Custo de Compras (R$)", def: "54.000,00" },
                    { id: "q5_tot", label: "Total de Ordens Emitidas", def: "900" },
                    { id: "q5_ord", label: "Ordens da Linha", def: "150" }
                ],
                calc: () => {
                    const c = parseBR(document.getElementById('q5_c').value);
                    const tot = parseBR(document.getElementById('q5_tot').value) || 1;
                    const ord = parseBR(document.getElementById('q5_ord').value);
                    const taxa = c / tot;
                    const r = taxa * ord;
                    return {
                        steps: [
                            `Passo 1: Taxa por Ordem de Compra = ${formatMoeda(c)} / ${tot} ordens = ${formatMoeda(taxa)} por ordem`,
                            `Passo 2: Multiplicar pelas ordens dedicadas: ${formatMoeda(taxa)} * ${ord} ordens`,
                            `Passo 3: Custo Indireto Absorvido = ${formatMoeda(r)}`
                        ],
                        res: formatMoeda(r),
                        dica: "Linhas com matérias-primas fragmentadas geram mais ordens de compra e demandam mais trabalho do setor de compras."
                    };
                }
            },
            {
                id: 6, titulo: "Questão 6: Custo Total Unitário no ABC", tag: "Custo Unitário",
                enunciado: "Somar os custos diretos com a parcela unitária de CIF apurada pelas atividades.",
                formula: "Custo Total Unitario = Custo Direto Unitario + (CIF ABC Total / Volume Produzido)",
                inputs: [
                    { id: "q6_cd", label: "Custo Direto Unitário (R$)", def: "42,00" },
                    { id: "q6_cif", label: "CIF ABC Total Alocado (R$)", def: "26.000,00" },
                    { id: "q6_vol", label: "Volume Produzido (un)", def: "1.300" }
                ],
                calc: () => {
                    const cd = parseBR(document.getElementById('q6_cd').value);
                    const cif = parseBR(document.getElementById('q6_cif').value);
                    const vol = parseBR(document.getElementById('q6_vol').value) || 1;
                    const cifUn = cif / vol;
                    const r = cd + cifUn;
                    return {
                        steps: [
                            `Passo 1: Apurar o CIF ABC por unidade = ${formatMoeda(cif)} / ${vol} un = ${formatMoeda(cifUn)} por peca`,
                            `Passo 2: Somar ao Custo Direto Unitario = ${formatMoeda(cd)} + ${formatMoeda(cifUn)}`,
                            `Passo 3: Custo Total Unitario ABC = ${formatMoeda(r)} por peca acabada`
                        ],
                        res: `${formatMoeda(r)} / un`,
                        dica: "Este é o custo unitário que formará o saldo de estoques e servirá de referência para a margem de precificação."
                    };
                }
            },
            {
                id: 7, titulo: "Questão 7: Diluição de Custo Fixo de Nível de Lote", tag: "Nível de Lote",
                enunciado: "Calcular o impacto unitário do custo fixo de preparação quando o tamanho do lote de fabricação é reduzido.",
                formula: "Custo Unitario de Preparacao = Custo Fixo da Preparacao / Tamanho do Lote",
                inputs: [
                    { id: "q7_cs", label: "Custo Fixo da Preparação (R$)", def: "1.200,00" },
                    { id: "q7_tam", label: "Tamanho do Lote (un)", def: "50" }
                ],
                calc: () => {
                    const cs = parseBR(document.getElementById('q7_cs').value);
                    const tam = parseBR(document.getElementById('q7_tam').value) || 1;
                    const r = cs / tam;
                    return {
                        steps: [
                            `Passo 1: Dividir o custo fixo de preparacao pela quantidade produzida: ${formatMoeda(cs)} / ${tam} unidades`,
                            `Passo 2: Custo Unitario de Preparacao = ${formatMoeda(r)} por peca`
                        ],
                        res: `${formatMoeda(r)} / un`,
                        dica: "Altere o lote para 1.000 peças para demonstrar como o custo unitário cai para R$ 1,20 por peça produzida."
                    };
                }
            },
            {
                id: 8, titulo: "Questão 8: Taxa do Minuto Útil no TDABC (Escala 5x2)", tag: "TDABC Moderno",
                enunciado: "Calcular a taxa do minuto de capacidade prática a partir do custo mensal da equipe e das horas úteis disponíveis.",
                formula: "Taxa do Minuto = Custo Total do Setor / (Horas Praticas * 60 minutos)",
                inputs: [
                    { id: "q8_custo", label: "Custo da Equipe (R$)", def: "28.800,00" },
                    { id: "q8_horas", label: "Horas Práticas Mensais", def: "600" }
                ],
                calc: () => {
                    const custo = parseBR(document.getElementById('q8_custo').value);
                    const horas = parseBR(document.getElementById('q8_horas').value) || 1;
                    const minutos = horas * 60;
                    const r = custo / minutos;
                    return {
                        steps: [
                            `Passo 1: Converter a capacidade pratica para minutos = ${horas} horas * 60 min = ${minutos} minutos`,
                            `Passo 2: Dividir o custo pelos minutos uteis: ${formatMoeda(custo)} / ${minutos} min`,
                            `Passo 3: Taxa por minuto de capacidade util = ${formatMoeda(r)} por minuto`
                        ],
                        res: `${formatMoeda(r)} / min`,
                        dica: "Com a jornada de 5 dias úteis, o custo por minuto se ajusta naturalmente para refletir o tempo disponível."
                    };
                }
            },
            {
                id: 9, titulo: "Questão 9: Apropriação de Ordem de Serviço no TDABC", tag: "TDABC Moderno",
                enunciado: "Multiplicar a duração da tarefa em minutos pela taxa unitária do minuto de trabalho.",
                formula: "Custo da Ordem = Taxa por Minuto * Minutos Consumidos",
                inputs: [
                    { id: "q9_taxa", label: "Taxa por Minuto (R$)", def: "0,80" },
                    { id: "q9_tempo", label: "Tempo Consumido (min)", def: "75" }
                ],
                calc: () => {
                    const taxa = parseBR(document.getElementById('q9_taxa').value);
                    const tempo = parseBR(document.getElementById('q9_tempo').value);
                    const r = taxa * tempo;
                    return {
                        steps: [
                            `Passo 1: Multiplicar a taxa do minuto pelo tempo dedicado: ${formatMoeda(taxa)} * ${tempo} minutos`,
                            `Passo 2: Custo total absorvido pela ordem = ${formatMoeda(r)}`
                        ],
                        res: formatMoeda(r),
                        dica: "O TDABC permite rastrear a lucratividade por pedido e por cliente a partir de equações de tempo simples."
                    };
                }
            },
            {
                id: 10, titulo: "Questão 10: Apuração da Capacidade Ociosa na Escala 5x2", tag: "Capacidade Ociosa",
                enunciado: "Segregar o custo das horas paradas para lançamento direto como perda operacional na DRE.",
                formula: "Perda com Ociosidade = (Custo Total / Cap. Pratica) * (Cap. Pratica - Horas Reais)",
                inputs: [
                    { id: "q10_c", label: "Custo dos Recursos (R$)", def: "90.000,00" },
                    { id: "q10_cp", label: "Capacidade Prática (horas)", def: "1.500" },
                    { id: "q10_cr", label: "Horas Efetivas Trabalhadas", def: "1.100" }
                ],
                calc: () => {
                    const c = parseBR(document.getElementById('q10_c').value);
                    const cp = parseBR(document.getElementById('q10_cp').value) || 1;
                    const cr = parseBR(document.getElementById('q10_cr').value);
                    const taxa = c / cp;
                    const ociosas = Math.max(0, cp - cr);
                    const r = taxa * ociosas;
                    return {
                        steps: [
                            `Passo 1: Apurar a taxa por hora pratica: ${formatMoeda(c)} / ${cp}h = ${formatMoeda(taxa)} por hora`,
                            `Passo 2: Identificar as horas ociosas no mes: ${cp}h - ${cr}h = ${ociosas} horas paradas`,
                            `Passo 3: Perda financeira com ociosidade = ${formatMoeda(taxa)} * ${ociosas}h = ${formatMoeda(r)}`
                        ],
                        res: formatMoeda(r),
                        dica: "Relembre que este montante não compõe o custo do produto; ele é lançado como dedução de resultado na DRE."
                    };
                }
            },
            {
                id: 11, titulo: "Questão 11: Rateio das Despesas de Logística e Expedição", tag: "Logística",
                enunciado: "Distribuir as despesas do setor de expedição proporcionalmente aos lotes faturados e despachados.",
                formula: "Custo Expedicao = (Custo Total de Expedicao / Total de Lotes) * Lotes da Linha",
                inputs: [
                    { id: "q11_c", label: "Custo da Expedição (R$)", def: "45.000,00" },
                    { id: "q11_tot", label: "Total de Lotes Despachados", def: "300" },
                    { id: "q11_lote", label: "Lotes da Linha", def: "40" }
                ],
                calc: () => {
                    const c = parseBR(document.getElementById('q11_c').value);
                    const tot = parseBR(document.getElementById('q11_tot').value) || 1;
                    const lote = parseBR(document.getElementById('q11_lote').value);
                    const taxa = c / tot;
                    const r = taxa * lote;
                    return {
                        steps: [
                            `Passo 1: Taxa por Despacho de Carga = ${formatMoeda(c)} / ${tot} lotes = ${formatMoeda(taxa)} por lote`,
                            `Passo 2: Multiplicar pelo numero de lotes da linha: ${formatMoeda(taxa)} * ${lote} lotes`,
                            `Passo 3: Custo de Expedicao Absorvido = ${formatMoeda(r)}`
                        ],
                        res: formatMoeda(r),
                        dica: "Clientes ou linhas que exigem entregas fracionadas devem ser tarifados de acordo com os despachos gerados."
                    };
                }
            },
            {
                id: 12, titulo: "Questão 12: Atividade de Programação de Turnos (Escala 5x2)", tag: "PCP / Gestão",
                enunciado: "Calcular o custo da atividade de planejamento de escalas e turnos absorvido por um setor fabril.",
                formula: "Custo Alocado = (Custo de Programacao / Total de Ordens de Turno) * Ordens do Setor",
                inputs: [
                    { id: "q12_c", label: "Custo da Programação (R$)", def: "22.000,00" },
                    { id: "q12_tot", label: "Total de Ordens Emitidas", def: "200" },
                    { id: "q12_ord", label: "Ordens do Setor Alfa", def: "55" }
                ],
                calc: () => {
                    const c = parseBR(document.getElementById('q12_c').value);
                    const tot = parseBR(document.getElementById('q12_tot').value) || 1;
                    const ord = parseBR(document.getElementById('q12_ord').value);
                    const taxa = c / tot;
                    const r = taxa * ord;
                    return {
                        steps: [
                            `Passo 1: Taxa por Ordem de Programacao = ${formatMoeda(c)} / ${tot} ordens = ${formatMoeda(taxa)} por ordem`,
                            `Passo 2: Multiplicar pelas ordens de turno emitidas: ${formatMoeda(taxa)} * ${ord} ordens`,
                            `Passo 3: Custo da Atividade Alocado = ${formatMoeda(r)}`
                        ],
                        res: formatMoeda(r),
                        dica: "A transição para 5x2 torna o PCP estratégico para distribuir a carga de trabalho de segunda a sexta sem sobrecargas."
                    };
                }
            }
        ];

        function renderPainel() {
            const nav = document.getElementById('navButtons');
            const container = document.getElementById('solversContainer');
            nav.innerHTML = '';
            container.innerHTML = '';

            configs.forEach(q => {
                nav.innerHTML += `<a href="#card-solv-${q.id}" class="nav-btn">Q${q.id}</a>`;

                const inputsHtml = q.inputs.map(inp => `
                    <div class="form-group">
                        <label class="form-label">${inp.label}</label>
                        <input type="text" id="${inp.id}" class="form-control" value="${inp.def}" oninput="resolver(${q.id})">
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="solver-card" id="card-solv-${q.id}">
                        <div class="solver-header">
                            <div>
                                <h2 class="card-title">${q.titulo}</h2>
                                <p style="font-size:0.85rem; color:var(--text-secondary); margin-top:2px;">${q.enunciado}</p>
                            </div>
                            <span class="card-tag">${q.tag}</span>
                        </div>
                        <div class="inputs-grid">${inputsHtml}</div>
                        <div class="solution-box">
                            <div class="formula-notepad">${q.formula}</div>
                            <ul class="step-list" id="steps-${q.id}"></ul>
                            <div class="res-final">
                                <div>
                                    <span style="font-size:0.75rem; text-transform:uppercase; color:var(--secondary-light);">Resposta Oficial</span>
                                    <div class="res-val" id="res-${q.id}">R$ 0,00</div>
                                </div>
                                <span style="font-size:0.85rem; opacity:0.85;">Atualização Dinâmica</span>
                            </div>
                            <div class="dica" id="dica-${q.id}"></div>
                        </div>
                    </div>
                `;
            });

            configs.forEach(q => resolver(q.id));
        }

        function resolver(id) {
            const q = configs.find(item => item.id === id);
            if (!q) return;
            const r = q.calc();
            document.getElementById(`steps-${id}`).innerHTML = r.steps.map(s => `<li class="step-item">• ${s}</li>`).join('');
            document.getElementById(`res-${id}`).innerText = r.res;
            document.getElementById(`dica-${id}`).innerHTML = `<strong>Dica Pedagógica em Sala:</strong> ${r.dica}`;
        }

        document.addEventListener('DOMContentLoaded', renderPainel);
    </script>
</body>
</html>
